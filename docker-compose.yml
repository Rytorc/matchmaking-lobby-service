services:
  backend:
    build:
      context: ./backend
    container_name: matchmaking_backend
    environment:
      APP_PORT: 8080
      APP_ENV: development
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: matchmaking_postgres
    environment:
      POSTGRES_DB: matchmaking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - matchmaking_postgres_data:/var/lib/postgresql/data

volumes:
  matchmaking_postgres_data: