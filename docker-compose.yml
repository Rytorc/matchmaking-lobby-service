services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matchmaking_backend
    environment:
      APP_PORT: 8080
      APP_ENV: development

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: matchmaking_db
      DB_USER: postgres
      DB_PASSWORD: postgres

      JWT_SECRET: change_me_later
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matchmaking_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  postgres:
    image: postgres:16
    container_name: matchmaking_postgres
    environment:
      POSTGRES_DB: matchmaking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - matchmaking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matchmaking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  matchmaking_postgres_data:
  frontend_node_modules: